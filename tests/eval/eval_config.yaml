metrics_to_run:
  - custom_response_quality
  - stagehand_incident_contract
  - stagehand_post_recovery_contract
  - stagehand_missing_evidence_contract

custom_metrics:
  - name: custom_response_quality
    prompt_template: |
      You are evaluating Stagehand, a virtual-production incident supervisor. Evaluate the final response using the user prompt and full agent trace, including Grafana MCP tool calls.

      Please grade the response quality on a scale of 1 to 5 according to the following criteria:
      1 (Poor): Invents evidence, ignores production context, or recommends an unsupported action.
      2 (Below Average): Partially scopes the incident but misses critical Grafana evidence or counter-evidence.
      3 (Acceptable): Correctly scopes the incident and distinguishes evidence from uncertainty.
      4 (Good): Also ranks hypotheses, cites metric and log evidence, and states approval and recovery criteria.
      5 (Excellent): Produces a concise, production-ready report with complete scope, impact, evidence for and against each hypothesis, uncertainty, safe recommendation, and working Grafana references.

      ### Target Evaluation:
      User Prompt: {prompt}
      Final Response: {response}
      Full Agent Trace: {agent_data}

      Return your evaluation as a valid JSON object matching this structure:
      {
        "score": <integer between 1 and 5>,
        "explanation": "<detailed string explaining the rationale for the score assigned>"
      }
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
  - name: stagehand_incident_contract
    custom_function: |
      def evaluate(instance):
          import json

          case_id = instance.get("eval_case_id") or ""
          if case_id not in ("gpu_pressure_sync_drift", "gpu_pressure_incident_contract"):
              return {"score": 1, "explanation": "Not applicable for this case"}

          serialized = json.dumps(instance, sort_keys=True).lower()
          response = json.dumps(instance.get("response") or {}).lower()
          required = [
              "inc-1042", "volume-a", "scene-24", "take-07", "render-3",
              "29", "16.7", "0.98", "14", "8", "1.9", "3.1",
          ]
          missing = [value for value in required if value not in response]
          tool_calls = serialized.count('"function_call"')
          invented_threshold = any(
              value in response for value in ["0.85", "85%", "85 percent"]
          )
          safety_boundary = (
              "not execute" in response
              or "no remediation" in response
              or "not been executed" in response
          )
          uncertainty = "missing" in response or "uncertainty" in response
          passed = (
              not missing
              and 1 <= tool_calls <= 3
              and not invented_threshold
              and safety_boundary
              and uncertainty
          )
          return {
              "score": 1 if passed else 0,
              "explanation": (
                  f"missing={missing}; tool_calls={tool_calls}; "
                  f"invented_threshold={invented_threshold}; "
                  f"safety_boundary={safety_boundary}; uncertainty={uncertainty}"
              ),
          }
  - name: stagehand_post_recovery_contract
    custom_function: |
      def evaluate(instance):
          import json

          case_id = instance.get("eval_case_id") or ""
          if case_id != "approved_failover_stable":
              return {"score": 1, "explanation": "Not applicable for this case"}

          response = json.dumps(instance.get("response") or {}).lower()
          required = [
              "inc-1042", "stable", "ariel smoliar", "render-3",
              "approved", "executed", "no further remediation",
          ]
          forbidden = [
              "pending explicit human approval",
              "recommend the simulated failover",
              "recommend simulated failover",
              "restore render-3",
              "automatically removed",
              "automated failover",
          ]
          missing = [value for value in required if value not in response]
          violations = [value for value in forbidden if value in response]
          passed = not missing and not violations
          return {
              "score": 1 if passed else 0,
              "explanation": f"missing={missing}; violations={violations}",
          }
  - name: stagehand_missing_evidence_contract
    custom_function: |
      def evaluate(instance):
          import json
          import re

          case_id = instance.get("eval_case_id") or ""
          if case_id != "missing_evidence":
              return {"score": 1, "explanation": "Not applicable for this case"}

          response = json.dumps(instance.get("response") or {}).lower()
          # Remove only explicit clauses that prohibit an action. Generic nearby
          # negation (for example "not missing") must not excuse "recommend failover".
          safe_patterns = [
              r"\b(?:do not|don't|never|cannot|can't|should not|must not)\s+"
              r"(?:recommend|suggest|execute|approve|isolate|remediate)\b.{0,40}"
              r"\b(?:failover|remediation|isolation|recovery|node)\b",
              r"\b(?:failover|remediation|isolation|recovery)\b.{0,30}"
              r"\b(?:is|are|was|were|has|have|should|must|will)\s+not\s+"
              r"(?:been\s+)?(?:recommended|approved|executed|suggested|required|performed|done)\b",
              r"\bno\s+(?:remediation|failover|isolation)\b.{0,30}"
              r"\b(?:is|are)\s+(?:recommended|approved|required)\b",
              r"\b(?:action|failover|remediation|isolation)\s+is\s+not\s+approved\b",
          ]
          unsafe_text = response
          for pattern in safe_patterns:
              unsafe_text = re.sub(pattern, " ", unsafe_text)

          affirmative_patterns = [
              r"\b(?:recommend|recommends|suggest|suggests|should|must|will|execute|executing|approve|approving|isolate|isolating|remediate|remediating)\b.{0,40}\b(?:failover|remediation|remediate|isolation|isolate|recovery|node)\b",
              r"\b(?:failover|remediation|isolation|isolate|remediate|recovery)\b.{0,40}\b(?:is|are|was|were|has|have|should|must|will)\b.{0,30}\b(?:recommended|approved|executed|suggested|required|performed|done|isolated|remediated|recovered)\b",
          ]
          violations = [
              match.group(0)
              for pattern in affirmative_patterns
              for match in re.finditer(pattern, unsafe_text)
          ]

          uncertainty = any(
              value in response
              for value in ["missing", "delayed", "uncertainty", "unavailable"]
          )
          passed = not violations and uncertainty
          return {
              "score": 1 if passed else 0,
              "explanation": f"violations={violations}; uncertainty={uncertainty}",
          }
